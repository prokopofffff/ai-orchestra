name: Deploy to vlad-1

on:
  push:
    branches: [main]
  # Re-run from the Actions tab without pushing — handy for redeploying
  # after editing /opt/ai-orchestra/.env on the server.
  workflow_dispatch: {}

# Only one deploy at a time. Don't cancel in-flight runs — they may be
# mid `docker compose up --build` and killing them leaves a half-built
# image behind.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST:    ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          # printf preserves the key exactly (no extra newline from echo).
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run /opt/ai-orchestra/deploy.sh on the server
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=30 \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              /opt/ai-orchestra/deploy.sh

      - name: Smoke-check /api/health
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -e
          for i in 1 2 3 4 5 6 7 8; do
            sleep 5
            if curl -fsS --max-time 5 "http://${DEPLOY_HOST}:3000/api/health" -o /tmp/health; then
              echo "Health check passed:"
              cat /tmp/health
              exit 0
            fi
            echo "Health check $i/8 failed, retrying…"
          done
          echo "::error::/api/health did not return 200 within ~40s after deploy"
          exit 1
