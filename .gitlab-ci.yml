# Deploy AI Orchestra to vlad-1 whenever main moves. SSHes into the server
# and runs /opt/ai-orchestra/deploy.sh, then smoke-checks /api/health.

stages:
  - deploy

deploy:
  stage: deploy
  image: alpine:3.20
  # Only one deploy at a time. GitLab queues additional jobs in the same
  # resource_group instead of cancelling — important because a cancelled
  # `docker compose up --build` leaves a half-built image behind.
  resource_group: deploy-main
  timeout: 25 minutes
  variables:
    GIT_STRATEGY: none
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
    # Manual "Run pipeline" from the UI — handy for redeploying after
    # editing /opt/ai-orchestra/.env on the server.
    - if: $CI_PIPELINE_SOURCE == "web"
  before_script:
    - apk add --no-cache openssh-client curl
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    # DEPLOY_SSH_KEY is a "file" variable — $DEPLOY_SSH_KEY is the path to
    # the runner-managed temp file containing the key, not its contents.
    - cp "$DEPLOY_SSH_KEY" ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - ssh -i ~/.ssh/id_ed25519
          -o StrictHostKeyChecking=yes
          -o ServerAliveInterval=30
          "${DEPLOY_USER}@${DEPLOY_HOST}" /opt/ai-orchestra/deploy.sh
    - |
      for i in 1 2 3 4 5 6 7 8; do
        sleep 5
        if curl -fsS --max-time 5 "http://${DEPLOY_HOST}:3000/api/health" -o /tmp/health; then
          echo "Health check passed:"
          cat /tmp/health
          exit 0
        fi
        echo "Health check $i/8 failed, retrying…"
      done
      echo "ERROR: /api/health did not return 200 within ~40s after deploy"
      exit 1
