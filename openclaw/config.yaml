# OpenClaw configuration for AI Orchestra
# See https://github.com/openclaw/openclaw for full documentation

gateway:
  port: 3100

channels:
  telegram:
    enabled: true
    # Bot token from @BotFather — set via TELEGRAM_BOT_TOKEN env var
    token: "${TELEGRAM_BOT_TOKEN}"
    # Security: require pairing code for new users
    security:
      policy: pairing-code

agents:
  orchestra-tech-lead:
    description: "AI Orchestra Tech Lead — routes user messages to the orchestrator"
    # Route all Telegram messages to this agent
    channels:
      - telegram
    workspace: /projects
    # Webhook to forward messages to n8n
    webhook:
      url: "http://n8n:5678/webhook/telegram-to-tech-lead"
      method: POST
      headers:
        Content-Type: application/json
