services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: orchestra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orchestra_secret}
      POSTGRES_DB: orchestra
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestra"]
      interval: 5s
      timeout: 5s
      retries: 5

  orchestra-core:
    build:
      # Build context is the workspace root so the multi-stage Dockerfile
      # can see shared/, dashboard/, and mcp-tools/ for the build stage.
      context: .
      dockerfile: orchestra-core/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://orchestra:${POSTGRES_PASSWORD:-orchestra_secret}@postgres:5432/orchestra
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      CLAUDE_AUTH: ${CLAUDE_AUTH:-max}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_DEFAULT_ORG: ${GITHUB_DEFAULT_ORG:-}
      GITHUB_DEFAULT_BRANCH: ${GITHUB_DEFAULT_BRANCH:-main}
      MODEL_TECH_LEAD: ${MODEL_TECH_LEAD:-opus}
      MODEL_DESIGNER: ${MODEL_DESIGNER:-sonnet}
      MODEL_FRONTEND: ${MODEL_FRONTEND:-sonnet}
      MODEL_BACKEND: ${MODEL_BACKEND:-sonnet}
      MODEL_QA: ${MODEL_QA:-sonnet}
      MODEL_DEVOPS: ${MODEL_DEVOPS:-sonnet}
      DASHBOARD_PATH: /app/dashboard
      # Volume-backed root the folder picker is clamped to (fs-api.ts).
      # Users can't pick a path outside this subtree, so a local_path
      # value can't accidentally point at a writable-layer dir that
      # vanishes on the next rebuild.
      WORKSPACE_ROOT: /workspace
      # repo-manager.ts writes per-project worktrees (cloned repos and
      # the temp-dir fallback for projects without repo_url) under this
      # path — keep it inside the workspace volume too.
      WORKSPACES_ROOT: /workspace/.tmp
    ports:
      - "3000:3000"
    volumes:
      # Session worktrees survive container rebuilds.
      - sessions_data:/app/data/sessions
      # User's Claude credentials (Max-subscription cookies) come from the
      # host. On the deploy server, /root/.claude is created empty until
      # the operator drops their credentials in — orchestra-core falls back
      # to CLAUDE_API_KEY when it's not present.
      - ${HOME}/.claude:/root/.claude:ro
      # Per-project provider credentials (CLAUDE_CONFIG_DIR / CODEX_HOME).
      # Must persist across container rebuilds — otherwise every redeploy
      # forces every project to re-authorize Claude and Codex.
      - orchestra_creds:/root/orchestra-creds
      # Volume-backed root for project working directories (see WORKSPACE_ROOT
      # env above). Without this volume, anything a user picks via the
      # folder picker would live in the container's writable layer and
      # vanish on the next rebuild.
      - workspace_data:/workspace
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  sessions_data:
  orchestra_creds:
  workspace_data:
